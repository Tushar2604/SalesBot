[project]
name = "salesrobo-api"
version = "0.1.0"
description = "Salesrobo clone — FastAPI app and Celery workers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "python-multipart>=0.0.12",
    # db
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",       # sync driver for alembic + celery tasks
    "alembic>=1.14",
    "greenlet>=3.1",
    # auth & crypto
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "cryptography>=43.0",
    # queue
    "celery[redis]>=5.4",
    "redis>=5.2",
    # integrations
    "httpx[http2]>=0.27",
    "anthropic>=0.39",
    "openai>=1.60",
    "google-genai>=1.0",
    "stripe>=11.1",
    "boto3>=1.35",
    "aiosmtplib>=3.0",
    # ops
    "structlog>=24.4",
    "tenacity>=9.0",
    "prometheus-client>=0.21",
    "sentry-sdk[fastapi,celery]>=2.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "freezegun>=1.5",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-boto3",
]
# Only the `api` image needs this — the remote-browser login session (Phase 1,
# see api/app/linkedin/remote_browser/) runs in-process there. `worker`/`beat`
# never launch a browser, so keeping this optional keeps their images lean.
browser = [
    "playwright>=1.47",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "C4", "SIM", "RUF"]
ignore = [
    "S101",  # assert is fine in tests
    "B008",  # FastAPI Depends() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S105",
    "S106",
    "S311",  # seeded RNG in tests is not a security decision
    "E501",  # sample CSV rows are long by nature
]
"alembic/*" = ["I001"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["alembic/versions/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
# Tests share the fixtures loop; asyncpg connections belong to the loop that
# created them, so a per-function loop would break every DB-backed test.
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[[tool.mypy.overrides]]
# Celery's task and signal decorators are untyped, so every decorated function
# would be flagged. The library is the limitation, not our code.
module = ["app.worker.*"]
disallow_untyped_decorators = false
